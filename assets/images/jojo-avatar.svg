<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="jojoBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="60%" stop-color="#1e1136" />
      <stop offset="100%" stop-color="#08090c" />
    </radialGradient>

    <!-- Electric Neon Volt Aura -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="goldEmblem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>

    <linearGradient id="voltCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CCFF00" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
  </defs>

  <!-- Circular Outer Frame -->
  <circle cx="100" cy="100" r="96" fill="url(#jojoBg)" stroke="#CCFF00" stroke-width="4" filter="url(#neonGlow)"/>

  <!-- Manga Speed Action Lines in Background -->
  <g stroke="rgba(204,255,0,0.18)" stroke-width="1.5">
    <line x1="100" y1="10" x2="100" y2="40" />
    <line x1="20" y1="50" x2="50" y2="70" />
    <line x1="180" y1="50" x2="150" y2="70" />
    <line x1="15" y1="100" x2="45" y2="100" />
    <line x1="185" y1="100" x2="155" y2="100" />
    <line x1="30" y1="160" x2="55" y2="140" />
    <line x1="170" y1="160" x2="145" y2="140" />
  </g>

  <!-- JOJO Menacing Katakana "ゴ" and "ド" (GOGO & DODO) in Aura -->
  <text x="22" y="48" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="28" fill="#CCFF00" opacity="0.85" transform="rotate(-15 22 48)">ゴ</text>
  <text x="14" y="95" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="34" fill="#00F0FF" opacity="0.9" transform="rotate(-8 14 95)">ゴ</text>
  <text x="156" y="52" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="32" fill="#FF3366" opacity="0.85" transform="rotate(18 156 52)">ド</text>
  <text x="160" y="105" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="36" fill="#CCFF00" opacity="0.9" transform="rotate(10 160 105)">ド</text>

  <!-- High-collar Athletic Dark Uniform -->
  <path d="M40 200 L60 155 L75 145 L100 160 L125 145 L140 155 L160 200 Z" fill="#141720" stroke="#000" stroke-width="3"/>
  <path d="M75 145 L100 160 L125 145 L125 180 L75 180 Z" fill="#CCFF00" opacity="0.15"/>
  <line x1="100" y1="160" x2="100" y2="200" stroke="#CCFF00" stroke-width="3"/>

  <!-- Neck & Strong Muscular Shadows -->
  <path d="M78 120 L78 150 L122 150 L122 120 Z" fill="#fbcfe8" stroke="#000" stroke-width="2"/>
  <path d="M85 125 L85 150 L115 150 L108 135 Z" fill="#f472b6" opacity="0.3"/>
  <!-- Manga Neck Crosshatch -->
  <line x1="90" y1="130" x2="98" y2="148" stroke="#000" stroke-width="1.5"/>
  <line x1="96" y1="130" x2="104" y2="148" stroke="#000" stroke-width="1.5"/>
  <line x1="102" y1="130" x2="110" y2="148" stroke="#000" stroke-width="1.5"/>

  <!-- Sharp JOJO Jawline & Face -->
  <polygon points="56,75 68,118 100,140 132,118 144,75 100,68" fill="#fce7f3" stroke="#000" stroke-width="3"/>
  
  <!-- Right Cheek / Jaw Heavy Shadow -->
  <polygon points="100,140 132,118 144,75 128,80 120,115 100,132" fill="#ec4899" opacity="0.25"/>

  <!-- Dramatic JOJO Cheek Hatchings (Hatching Lines) -->
  <line x1="68" y1="98" x2="78" y2="112" stroke="#000" stroke-width="2"/>
  <line x1="74" y1="98" x2="84" y2="112" stroke="#000" stroke-width="2"/>
  <line x1="80" y1="100" x2="88" y2="114" stroke="#000" stroke-width="2"/>

  <line x1="122" y1="98" x2="114" y2="112" stroke="#000" stroke-width="2"/>
  <line x1="128" y1="98" x2="120" y2="112" stroke="#000" stroke-width="2"/>

  <!-- Nose (Sharp Sculpted Angle) -->
  <polygon points="98,82 104,106 93,109" fill="#db2777" opacity="0.2"/>
  <polyline points="98,82 104,106 93,109" fill="none" stroke="#000" stroke-width="2.5" stroke-linejoin="miter"/>

  <!-- Confident JOJO Mouth / Smirk -->
  <path d="M86 122 Q100 126 114 121" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round"/>
  <path d="M92 128 Q100 130 108 128" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"/>

  <!-- Intense Sharp Eyes & Brows -->
  <!-- Left Eye & Heavy Brow -->
  <polygon points="68,76 92,72 88,78 70,80" fill="#000"/>
  <polygon points="72,82 88,80 84,88 74,88" fill="#fff" stroke="#000" stroke-width="2"/>
  <circle cx="81" cy="84" r="3.5" fill="#CCFF00" stroke="#000" stroke-width="1.5"/>
  <circle cx="82" cy="83" r="1.2" fill="#fff"/>
  <!-- Forehead Tension Crosshatch -->
  <line x1="92" y1="68" x2="92" y2="76" stroke="#000" stroke-width="2"/>
  <line x1="96" y1="67" x2="96" y2="75" stroke="#000" stroke-width="2"/>

  <!-- Right Eye & Heavy Brow -->
  <polygon points="132,76 108,72 112,78 130,80" fill="#000"/>
  <polygon points="128,82 112,80 116,88 126,88" fill="#fff" stroke="#000" stroke-width="2"/>
  <circle cx="119" cy="84" r="3.5" fill="#00F0FF" stroke="#000" stroke-width="1.5"/>
  <circle cx="118" cy="83" r="1.2" fill="#fff"/>

  <!-- Iconic JOJO / Jotaro Athletic Cap & Hair Fusion -->
  <!-- Cap Crown -->
  <path d="M42 62 Q100 25 158 62 L152 75 Q100 48 48 75 Z" fill="#0B0C10" stroke="#000" stroke-width="3"/>
  
  <!-- Back Hair Blending seamlessly into Cap (Classic Jotaro Trait) -->
  <path d="M142 55 Q168 85 162 120 Q145 105 144 85 Z" fill="#0B0C10" stroke="#000" stroke-width="2"/>
  <path d="M58 55 Q32 85 38 120 Q55 105 56 85 Z" fill="#0B0C10" stroke="#000" stroke-width="2"/>

  <!-- Cap Visor (Angular & Slanted) -->
  <polygon points="38,72 162,72 148,84 52,84" fill="#181B22" stroke="#CCFF00" stroke-width="2.5"/>

  <!-- Golden Hand / Star Badge on Cap -->
  <g transform="translate(90, 42)">
    <rect x="0" y="0" width="20" height="20" rx="3" fill="url(#goldEmblem)" stroke="#000" stroke-width="2"/>
    <!-- Iconic Star Emblem -->
    <path d="M10 2 L12.5 7.5 L18 8 L14 12 L15.5 17.5 L10 14.5 L4.5 17.5 L6 12 L2 8 L7.5 7.5 Z" fill="#CCFF00"/>
  </g>

  <!-- Glowing Star Birthmark Silhouette floating near shoulder -->
  <path d="M148 152 L151 160 L159 161 L153 167 L155 175 L148 171 L141 175 L143 167 L137 161 L145 160 Z" fill="#CCFF00" opacity="0.9" filter="url(#neonGlow)"/>
</svg>
